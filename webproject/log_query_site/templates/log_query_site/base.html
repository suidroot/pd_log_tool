<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{% block meta_description %}Police Log Database{% endblock %}">
    <title>{% block title %}Police Log DB{% endblock %}</title>
    <style>
      :root {
        --nav-bg:       #333;
        --accent:       #4a7fcb;
        --accent-hover: #3a6ab8;
        --bg:           #f0f2f5;
        --card:         #ffffff;
        --border:       #dde1e7;
        --text:         #2c2c2c;
        --text-muted:   #6b7280;
        --radius:       8px;
        --shadow-sm:    0 1px 3px rgba(0,0,0,.08);
        --shadow-md:    0 4px 12px rgba(0,0,0,.10);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      /* ── Navigation ── */
      .nav {
        background: var(--nav-bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        height: 54px;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-brand {
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .3px;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .nav-links a {
        color: rgba(255,255,255,.8);
        text-decoration: none;
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        transition: background .15s, color .15s;
      }
      .nav-links a:hover {
        background: rgba(255,255,255,.12);
        color: #fff;
      }
      .nav-user {
        color: rgba(255,255,255,.5);
        font-size: 13px;
        margin-left: 16px;
        border-left: 1px solid rgba(255,255,255,.15);
        padding-left: 16px;
      }

      /* ── Page content ── */
      .content {
        max-width: 1140px;
        margin: 32px auto;
        padding: 0 24px;
      }

      /* ── Cards ── */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 24px 28px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 20px;
        color: var(--text);
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 14px;
        color: var(--text);
      }

      /* ── Tables ── */
      .table-wrap { overflow-x: auto; border-radius: var(--radius); }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      thead th {
        background: var(--nav-bg);
        color: #fff;
        padding: 10px 13px;
        text-align: left;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .5px;
        white-space: nowrap;
      }
      thead th:first-child { border-radius: var(--radius) 0 0 0; }
      thead th:last-child  { border-radius: 0 var(--radius) 0 0; }
      tbody td {
        padding: 9px 13px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:nth-child(even) { background: #f7f8fb; }
      tbody tr:hover { background: #eef2ff; }

      /* ── Forms ── */
      .form-group { margin-bottom: 16px; }
      .form-group label,
      .field-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: .4px;
      }
      input[type="text"],
      input[type="number"],
      input[type="datetime-local"],
      input[type="password"],
      select {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 14px;
        width: 100%;
        background: #fff;
        color: var(--text);
        transition: border-color .15s, box-shadow .15s;
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(74,127,203,.15);
      }
      select[multiple] { height: 120px; }

      .radio-group { display: flex; flex-direction: column; gap: 6px; }
      .radio-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        cursor: pointer;
      }
      .radio-group input[type="radio"] { width: auto; }

      .btn {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s;
        text-decoration: none;
      }
      .btn:hover { background: var(--accent-hover); }
      .btn-secondary {
        background: #fff;
        color: var(--text-muted);
        border: 1px solid var(--border);
        margin-left: 8px;
      }
      .btn-secondary:hover { background: #f5f5f5; color: var(--text); }

      input[type="submit"] { /* keep native submit looking like .btn */
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s;
      }
      input[type="submit"]:hover { background: var(--accent-hover); }
      input[type="reset"] {
        background: #fff;
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-left: 8px;
        transition: background .15s;
      }
      input[type="reset"]:hover { background: #f5f5f5; color: var(--text); }

      fieldset { border: none; padding: 0; margin: 0; }

      /* ── Grid helper ── */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

      /* ── Divider ── */
      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      /* ── Badge ── */
      .badge {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 20px;
        vertical-align: middle;
        margin-left: 8px;
      }

      /* ── Not-logged-in state ── */
      .login-prompt {
        text-align: center;
        padding: 60px 24px;
      }
      .login-prompt p { color: var(--text-muted); margin-bottom: 16px; }
    </style>
  {% block extra_style %}{% endblock %}
  </head>
  <body>

    <nav class="nav">
      <a class="nav-brand" href="/">Police Log DB</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/search/">Search</a>
        <a href="/reports/">Reports</a>
        <a href="/logout/">Logout</a>
        {% if user.is_authenticated %}
        <span class="nav-user">{{ user.username }}</span>
        {% endif %}
      </div>
    </nav>

    <div class="content">
      {% if user.is_authenticated %}
        {% block content %}{% endblock %}
      {% else %}
        <div class="card login-prompt">
          <p>You must be logged in to access this page.</p>
          <a class="btn" href="{% url 'login' %}">Log In</a>
        </div>
      {% endif %}
    </div>

  </body>
</html>
